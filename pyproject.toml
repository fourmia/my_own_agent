[project]
name = "ai-learn-mini-agent"
version = "0.1.0"
description = "A from-scratch learning project for building coding agents in Python."
requires-python = ">=3.9"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
openai = [
    "openai>=2.0,<3",
]
dev = [
    "openai>=2.0,<3",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in tests that call a real external Provider",
]
